[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cctv-pipeline"
version = "1.0.0"
description = "Robust CCTV Video Analytics Under Illumination Changes and Compression Artifacts"
authors = [
    {name = "CHRIST University Research", email = "research@christuniversity.in"}
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "opencv-python>=4.9.0",
    "ultralytics>=8.3.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "pydantic>=2.5.0",
    "pyyaml>=6.0.0",
    "matplotlib>=3.7.0",
    "flask>=3.0.0",
    "numpy>=1.24.0",
]

[project.scripts]
cctv-pipeline = "cctv_pipeline.cli:main"

[tool.setuptools.packages.find]
include = ["cctv_pipeline*"]
